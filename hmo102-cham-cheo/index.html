<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Đánh giá đồng đội</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head><body>
<header class="band"><div class="in">
  <div class="eyebrow">HMO102 · Final Project · FA26</div>
  <h1>Đánh giá đồng đội</h1>
  <p>Chấm đóng góp của từng thành viên trong nhóm. Điểm bạn chấm được ẩn danh với các bạn khác.</p>
</div></header>
<div class="wrap" id="app"><div class="empty">Đang tải danh sách nhóm...</div></div>
<div id="bar"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
const LS='hmo102-peer-v1';
const S={me:null,draft:null,pick:{gid:'',mid:''},err:'',msg:'',busy:false,sent:null,lastCode:''};
const app=document.getElementById('app'),bar=document.getElementById('bar');
const grp=id=>CFG.groups.find(g=>g.id===id);
function load(){try{const o=JSON.parse(localStorage.getItem(LS)||'null');if(o){S.me=o.me||null;S.draft=o.draft||null;S.sent=o.sent||null;S.lastCode=o.lastCode||''}}catch(e){}}
function save(){try{localStorage.setItem(LS,JSON.stringify({me:S.me,draft:S.draft,sent:S.sent,lastCode:S.lastCode}))}catch(e){}}
function blank(){return{rep:0,pre:0,res:0,col:0,comment:''}}
function initDraft(g,me){const d={gid:g.id,mid:me.id,scores:{},self:blank()};g.members.forEach(m=>{if(m.id!==me.id)d.scores[m.id]=blank()});S.draft=d;save()}
function ready(v,self){const low=CRIT.some(c=>v[c.k]&&v[c.k]<3);return CRIT.every(c=>v[c.k])&&(self||!low||v.comment.trim().length>=10)}
function missingCount(g,me){let n=0;g.members.filter(m=>m.id!==me.id).forEach(m=>{if(!ready(S.draft.scores[m.id],false))n++});if(!ready(S.draft.self,true))n++;return n}
function render(){
  bar.innerHTML='';
  if(!S.me){
    const g=grp(S.pick.gid);
    let h='<div class="card"><h2>Vào chấm đồng đội</h2><p class="muted small" style="margin:0">Chọn nhóm, chọn tên của bạn và nhập mã nhóm do giảng viên gửi.</p><label class="f" for="selG">Nhóm</label><select id="selG"><option value="">Chọn nhóm</option>'+CFG.groups.map(x=>`<option value="${esc(x.id)}"${x.id===S.pick.gid?' selected':''}>${esc(x.name)}</option>`).join('')+'</select>';
    if(g){
      h+='<label class="f">Tên của bạn</label><div class="chips">'+g.members.map(m=>`<button class="chip" data-act="pickM" data-id="${esc(m.id)}" aria-pressed="${m.id===S.pick.mid}">${esc(m.name)}</button>`).join('')+'</div>';
      h+='<label class="f" for="code">Mã nhóm</label><input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="Ví dụ K7M2QX">';
      h+=`<div class="err" id="err">${esc(S.err)}</div><div style="margin-top:14px"><button class="btn" data-act="enter" ${S.busy?'disabled':''}>Vào chấm</button></div>`;
    }
    app.innerHTML=h+'</div>';return;
  }
  const g=grp(S.me.gid),me=g&&g.members.find(m=>m.id===S.me.mid);
  if(!g||!me){S.me=null;S.draft=null;save();return render()}
  if(!S.draft||S.draft.gid!==g.id||S.draft.mid!==me.id)initDraft(g,me);
  const open=isOpen(g),peers=g.members.filter(m=>m.id!==me.id);
  let h=`<div class="card"><div class="row" style="justify-content:space-between"><div><div class="eyebrow">${esc(g.name)}</div><h2 style="margin:2px 0 0">Xin chào ${esc(me.name)}</h2></div><button class="btn ghost sm" data-act="logout">Đổi người dùng</button></div>`;
  h+=`<p class="small muted" style="margin:10px 0 0">Chấm từ 1 đến 5 cho 4 tiêu chí. Dưới 3 ở bất kỳ tiêu chí nào thì cần ghi lý do. Bạn nộp lại được đến hạn <b>${esc(fmtT(g.deadline))}</b>, bài nộp sau cùng là bài được tính.</p></div>`;
  if(S.sent)h+=`<div class="notice">Bạn đã nộp lúc ${esc(fmtT(S.sent))}. ${open?'Muốn sửa thì chỉnh bên dưới rồi bấm Nộp lại.':''}</div>`;
  if(!open)h+='<div class="notice bad">Chấm chéo đã đóng.</div>';
  if(S.lastCode)h+=`<div class="card"><h3>Mã dự phòng</h3><p class="small muted" style="margin:4px 0 0">Nếu không chắc đã gửi được, hãy sao chép mã này và gửi cho giảng viên qua Zalo hoặc LMS.</p><div class="codebox" id="cb">${esc(S.lastCode)}</div><div style="margin-top:10px"><button class="btn ghost sm" data-act="copy">Sao chép mã</button></div></div>`;
  peers.forEach(m=>h+=personCard(m,S.draft.scores[m.id],false,open));
  h+=personCard(me,S.draft.self,true,open);
  app.innerHTML=h;drawBar(g,me,peers,open);
}
function personCard(m,v,isSelf,open){
  const low=CRIT.some(c=>v[c.k]&&v[c.k]<3),ok=ready(v,isSelf),w=isSelf?'self':esc(m.id);
  let h=`<div class="card" data-card="${w}"><div class="person"><div class="avatar">${esc(m.name.trim().charAt(0).toUpperCase())}</div><div><h3>${isSelf?'Tự đánh giá bản thân':esc(m.name)}</h3><div class="small muted">${isSelf?'Chỉ để đối chiếu, không tính vào hệ số điều chỉnh':'Đánh giá đóng góp của bạn này'}</div></div><span class="done${ok?' y':''}">${ok?'Xong':'Chưa xong'}</span></div>`;
  CRIT.forEach(c=>{
    h+=`<div class="crit"><div class="t">${c.t}</div><div class="d">${c.d}</div><div class="scale" role="group" aria-label="${esc(c.t)}">`;
    for(let i=1;i<=5;i++)h+=`<button data-act="star" data-who="${w}" data-k="${c.k}" data-v="${i}" aria-pressed="${v[c.k]===i}" ${open?'':'disabled'}>${i}</button>`;
    h+=`</div><div class="lv">${LV[v[c.k]]||'Chưa chấm'}</div></div>`;
  });
  const need=low&&!isSelf;
  h+=`<label class="f" for="c-${w}">Nhận xét ${need?'<span style="color:var(--bad)">(bắt buộc, ít nhất 10 ký tự)</span>':'(không bắt buộc)'}</label><textarea id="c-${w}" data-act="cmt" data-who="${w}" ${open?'':'disabled'} placeholder="${need?'Nêu việc cụ thể khiến bạn chấm thấp':'Ví dụ: bạn hoàn thành phần việc đúng hạn và hỗ trợ nhóm'}">${esc(v.comment)}</textarea></div>`;
  return h;
}
function drawBar(g,me,peers,open){
  const total=peers.length+1,miss=missingCount(g,me),done=total-miss;
  bar.innerHTML=`<div class="bar"><div class="in"><div class="prog"><div class="small"><b>${done}/${total}</b> phần đã xong${S.msg?` · <span class="ok">${esc(S.msg)}</span>`:''}${S.err?` · <span style="color:var(--bad)">${esc(S.err)}</span>`:''}</div><div class="track"><div class="fill" style="width:${done/total*100}%"></div></div></div><button class="btn brass" data-act="submit" ${(!open||miss||S.busy)?'disabled':''}>${S.sent?'Nộp lại':'Nộp bài chấm'}</button></div></div>`;
}
function curG(){const g=grp(S.me.gid);return{g,me:g.members.find(m=>m.id===S.me.mid)}}
function refreshCard(who){
  const{g,me}=curG(),el=document.querySelector(`[data-card="${CSS.escape(who)}"]`);if(!el)return;
  const m=who==='self'?me:g.members.find(x=>x.id===who),v=who==='self'?S.draft.self:S.draft.scores[who];
  const t=document.createElement('div');t.innerHTML=personCard(m,v,who==='self',isOpen(g));el.replaceWith(t.firstElementChild);
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='pickM'){S.pick.mid=b.dataset.id;render()}
  else if(a==='logout'){S.me=null;S.draft=null;S.sent=null;S.lastCode='';S.msg='';save();render()}
  else if(a==='enter'){
    const g=grp(S.pick.gid),code=(document.getElementById('code').value||'').trim().toUpperCase();
    if(!g||!S.pick.mid){S.err='Chọn nhóm và tên của bạn.';return render()}
    if(!code){S.err='Nhập mã nhóm.';return render()}
    try{
      if(await sha(g.id+':'+code)!==g.codeHash){S.err='Mã nhóm chưa đúng. Kiểm tra lại mã giảng viên gửi.';return render()}
      S.me={gid:g.id,mid:S.pick.mid};S.err='';S.draft=null;S.sent=null;S.lastCode='';save();
    }catch(x){S.err='Trình duyệt này không kiểm tra được mã. Mở lại bằng Chrome hoặc Safari.'}
    render();
  }
  else if(a==='star'){
    const w=b.dataset.who,t=w==='self'?S.draft.self:S.draft.scores[w];t[b.dataset.k]=+b.dataset.v;S.msg='';S.err='';save();refreshCard(w);redraw();
  }
  else if(a==='submit')await submit();
  else if(a==='copy'){try{await navigator.clipboard.writeText(S.lastCode);b.textContent='Đã sao chép'}catch(x){const r=document.createRange();r.selectNodeContents(document.getElementById('cb'));getSelection().removeAllRanges();getSelection().addRange(r);b.textContent='Đã chọn mã, bấm sao chép'}}
});
document.addEventListener('input',e=>{
  const t=e.target;if(!t.dataset||t.dataset.act!=='cmt')return;
  const w=t.dataset.who,v=w==='self'?S.draft.self:S.draft.scores[w];v.comment=t.value;S.msg='';save();
  const pill=t.closest('.card').querySelector('.done'),ok=ready(v,w==='self');pill.className='done'+(ok?' y':'');pill.textContent=ok?'Xong':'Chưa xong';
  redraw();
});
document.addEventListener('change',e=>{if(e.target.id==='selG'){S.pick={gid:e.target.value,mid:''};S.err='';render()}});
function redraw(){const{g,me}=curG();drawBar(g,me,g.members.filter(m=>m.id!==me.id),isOpen(g))}
async function submit(){
  const{g,me}=curG();if(!isOpen(g)||missingCount(g,me))return;
  S.busy=true;S.err='';redraw();
  const code=encodeResult(g.id,me.id,me.name,S.draft.scores,S.draft.self);
  S.lastCode=code;
  try{
    const fd=new FormData();fd.append(CFG.entry,code);
    await fetch(CFG.formUrl,{method:'POST',mode:'no-cors',body:fd});
    S.sent=Date.now();S.msg='Đã gửi cho giảng viên';
  }catch(x){S.err='Chưa gửi được, hãy gửi mã dự phòng cho giảng viên.'}
  S.busy=false;save();render();
}
load();render();
</script></body></html>
