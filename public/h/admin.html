<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Quản trị chấm chéo · HMO102</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Itim&display=swap">
<link rel="stylesheet" href="/hmo102/h.css">
<style>.sheet{max-width:980px}.gh{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px;margin-top:8px}.who{font-size:13px;padding:5px 8px;border:1.5px solid var(--line);border-radius:8px}.who.y{border-color:var(--ink);background:var(--soft)}.who.r{border-color:var(--wine);background:var(--wine-soft)}
.step{display:flex;gap:10px;align-items:center}.sn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--hand);font-size:17px}.sn.on{background:var(--wine)}.sn.ok{background:var(--ok)}
.qrw{display:grid;grid-template-columns:minmax(200px,260px) 1fr;gap:18px;align-items:center;margin-top:10px}@media(max-width:620px){.qrw{grid-template-columns:1fr}}.rc{font-family:var(--hand);font-size:44px;letter-spacing:.12em;color:var(--wine)}
.abar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:#fff;border-top:3px solid var(--wine);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px))}
.abar .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
.abar .btn{border-color:#fff;box-shadow:0 3px 0 #fff}.abar .btn.brass{background:var(--wine)}.abar .btn.ghost{background:#fff;color:var(--ink)}
.abar b.clk{font-family:var(--hand);font-size:34px;font-weight:400;letter-spacing:.05em}
body{padding-bottom:110px}
</style>
</head><body>
<main class="sheet">
<header class="hero"><div><div class="eyebrow">Giảng viên</div><h1>Quản trị chấm chéo</h1><p>Mỗi lượt chấm là một nhóm: thiết lập, tạo QR, chờ vào phòng, bắt đầu, kết thúc, tải kết quả.</p><p style="margin-top:10px"><a class="btn brass sm" href="/hmo102/screen" target="hmo102screen" rel="noopener" style="display:inline-block;text-decoration:none">🖥️ Mở màn hình chiếu cho sinh viên (tab mới)</a></p></div></header>
<div id="app"></div>
</main>
<script src="/hmo102/common.js"></script>
<script>
const LS='hmo102-h-admin';
let TOK='';try{TOK=localStorage.getItem(LS)||''}catch(e){}
let restoring=false;const RK='hmo102-h-roster';
function cachedRoster(){try{const b=localStorage.getItem(RK);if(!b)return null;const bin=atob(b),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u}catch(e){return null}}
function cacheRoster(buf){try{const u=new Uint8Array(buf);let bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode.apply(null,u.subarray(i,i+8192));localStorage.setItem(RK,btoa(bin))}catch(e){}}
let CONF='',confT=null;
let ST=null,SEL=null,MIN=10,ERR='',MSG='',lastSig='';
const H=()=>({Authorization:'Bearer '+TOK});
const app=document.getElementById('app');
function login(){
  app.innerHTML=`<div class="card"><h2>Đăng nhập</h2><label class="f" for="pw">Mật khẩu</label><input id="pw" type="password" style="width:100%;font:inherit;border:2px solid var(--ink);border-radius:12px;padding:10px 12px"><div class="err">${esc(ERR)}</div><div style="margin-top:14px"><button class="btn" data-act="login">Vào</button></div></div>`;
}
async function refresh(){
  if(!TOK)return;
  try{ST=await api('/api/h/admin/state',{headers:H()});syncNow(ST.now);
    if(!ST.total&&!restoring){const c=cachedRoster();if(c){restoring=true;try{const r=await fetch('/api/h/admin/roster',{method:'POST',headers:H(),body:c});const j=await r.json();if(r.ok){MSG='Máy chủ vừa khởi động lại, đã tự nạp lại danh sách lớp ('+j.added+' bạn, '+j.groups+' nhóm).';ST=await api('/api/h/admin/state',{headers:H()})}}catch(x){}restoring=false}}
    draw()}
  catch(e){if(e.status===401){TOK='';login()}else{ERR=e.message}}
}
const stepHead=(n,t,st)=>`<div class="step"><div class="sn ${st}">${st==='ok'?'✓':n}</div><h3>${t}</h3></div>`;
function resultBlock(sg){
  let h=`<p class="small muted" style="margin:6px 0 0">${sg.raters}/${sg.total} bạn đã nộp. Điểm trung bình cả nhóm: <b>${sg.gAvg||'-'}</b>. Hệ số = TB nhận được ÷ TB cả nhóm, giới hạn 0,80 đến 1,10.</p>`;
  h+=`<div class="tscroll"><table><thead><tr><th>Thành viên</th><th>Số bạn chấm</th><th>Nội dung</th><th>Slide</th><th>Trách nhiệm</th><th>Hợp tác</th><th>TB</th><th>Hệ số</th><th>Tự chấm</th></tr></thead><tbody>${sg.rows.map(r=>`<tr><td>${esc(r.name)}</td><td>${r.n}</td>${r.crit.map(x=>`<td>${x==null?'-':x}</td>`).join('')}<td><b>${r.avg==null?'-':r.avg}</b></td><td class="coef">${r.coef==null?'-':String(r.coef).replace('.',',')}</td><td>${r.self==null?'-':r.self}</td></tr>`).join('')}</tbody></table></div>`;
  if(sg.missing.length)h+=`<p style="margin:12px 0 0"><span class="tag">Chưa nộp</span> ${sg.missing.map(esc).join(', ')}</p>`;
  if(sg.flags.length)h+=`<div style="margin-top:8px">`+sg.flags.map(f=>`<div class="cm"><span class="tag w">Cảnh báo</span> <b>${esc(f.who)}</b> ${esc(f.text)}</div>`).join('')+'</div>';
  const cms=sg.rows.filter(r=>r.comments.length);
  if(cms.length){h+='<h3 style="margin-top:16px">Nhận xét</h3>';cms.forEach(r=>{h+=`<div style="margin-top:8px"><b>${esc(r.name)}</b>`+r.comments.map(c=>`<div class="cm">${c.low?'<span class="tag">Chấm thấp</span> ':''}<b>${esc(c.rater)}:</b> ${esc(c.text)}</div>`).join('')+'</div>'})}
  return h;
}
function draw(){
  if(!ST)return;
  const S=ST.session;
  if(SEL==null&&ST.groups.length)SEL=ST.groups[0].g;
  if(S)SEL=S.g;
  const sig=JSON.stringify([ST.groups.map(g=>[g.list.map(x=>[x.logged,x.inRoom,x.submitted]),g.rows.map(r=>[r.n,r.avg])]),S&&[S.id,S.status,S.endsAt,S.inRoom],ST.hasResults,SEL,MIN,MSG,ERR,ST.total,CONF,ST.music]);
  if(sig===lastSig){tick();return}lastSig=sig;
  let h='';
  const hasRoster=ST.total>0;
  // Bước 1
  h+=`<div class="card">${stepHead(1,'Danh sách lớp',hasRoster?'ok':'on')}<p class="small muted" style="margin:6px 0 0">${hasRoster?`Đã nạp <b>${ST.total}</b> bạn, <b>${ST.groups.length}</b> nhóm.`:'Chọn file bảng điểm .xlsx của lớp (cột MSSV, Họ tên, Nhóm).'} Bạn không có nhóm sẽ tự bị loại.</p><div class="row" style="margin-top:10px"><input type="file" id="fx" accept=".xlsx" style="display:none"><button class="btn ghost sm" data-act="pick" ${S&&S.status!=='ended'?'disabled':''}>${hasRoster?'Nạp lại danh sách':'Chọn file danh sách'}</button></div></div>`;
  if(!ST.groups.length){app.innerHTML=h+`<div class="card">${stepHead(2,'Thiết lập lượt chấm','')}<p class="small muted" style="margin:6px 0 0">Nạp danh sách lớp ở bước 1 trước, rồi chọn nhóm và thời gian chấm.</p></div><div class="card">${stepHead(3,'Tạo mã QR và chờ cả nhóm vào phòng','')}<div style="margin-top:10px"><button class="btn brass" disabled>Tạo mã QR</button></div></div>${ERR?`<div class="err">${esc(ERR)}</div>`:''}${MSG?`<div class="ok small">${esc(MSG)}</div>`:''}`;return}
  const sg=ST.groups.find(g=>g.g===SEL);
  const active=S&&S.status!=='ended';
  // Bước 2
  h+=`<div class="card">${stepHead(2,'Thiết lập lượt chấm',active||S?'ok':'on')}`;
  if(active||S){h+=`<p class="small muted" style="margin:6px 0 0">Nhóm <b>${S.g}</b> · ${S.minutes} phút</p>`}
  else{
    h+='<p class="small muted" style="margin:6px 0 8px">Chọn nhóm và thời gian chấm.</p><div class="tabs">'+ST.groups.map(g=>{const j=g.list.filter(x=>x.logged).length;return `<button class="chip" data-act="sel" data-g="${g.g}" aria-pressed="${g.g===SEL}">Nhóm ${g.g} · đăng nhập ${j}/${g.total}</button>`}).join('')+`</div><div class="chips" style="margin-top:10px">${[5,10,15,20].map(m=>`<button class="chip" data-act="min" data-m="${m}" aria-pressed="${m===MIN}">${m} phút</button>`).join('')}</div>`;
    h+=`<div class="gh">${sg.list.map(x=>`<div class="who${x.logged?' y':''}">${x.logged?'✔ ':'· '}${esc(x.name)}${x.leader?' (trưởng nhóm)':''}</div>`).join('')}</div><p class="small muted" style="margin:6px 0 0">✔ là bạn đã đăng nhập vào trang.</p>`;
  }
  h+='</div>';
  // Bước 3
  const st3=!S?'':(S.status==='open'?'on':'ok');
  h+=`<div class="card">${stepHead(3,'Tạo mã QR và chờ cả nhóm vào phòng',st3)}`;
  if(!S){h+=`<div style="margin-top:10px"><button class="btn brass" data-act="create">Tạo mã QR cho Nhóm ${SEL}</button></div>`}
  else{
    if(S.status==='open'){
      h+=`<div class="qrw"><div><img class="qr" src="/h/qr.svg?mode=room&t=${S.id}" alt="QR phòng chờ"></div><div><div class="eyebrow">Mã phòng (nếu quét không được)</div><div class="rc">${esc(S.code)}</div><p class="small muted">Cho cả lớp thấy màn hình chiếu: <a href="/hmo102/screen" target="_blank" rel="noopener">mở màn hình chiếu</a>. Các bạn Nhóm ${S.g} đã đăng nhập sẽ quét QR này.</p><div class="big-clock" style="font-size:54px;text-align:left;margin:4px 0">${S.inRoom}/${sg.total}</div><div class="small muted">bạn đã vào phòng chờ</div></div></div>`;
    }
    h+=`<div class="gh">${sg.list.map(x=>`<div class="who${x.inRoom?' y':x.logged?' r':''}">${x.inRoom?'✔ ':x.logged?'○ ':'· '}${esc(x.name)}${x.submitted?' · đã nộp':''}</div>`).join('')}</div><p class="small muted" style="margin:6px 0 0">✔ đã vào phòng chờ · ○ đã đăng nhập, chưa quét QR · · chưa đăng nhập</p>`;
    if(S.status==='open')h+=`<div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="cancel">Hủy phòng chờ</button></div>`;
  }
  h+='</div>';
  // Bước 4
  h+=`<div class="card">${stepHead(4,'Bắt đầu và theo dõi',!S?'':S.status==='open'?'on':S.status==='running'?'on':'ok')}`;
  if(S&&S.status==='open'){
    h+=`<div style="margin-top:10px"><button class="btn brass" data-act="start">Bắt đầu chấm Nhóm ${S.g} (${S.minutes} phút)</button></div><p class="small muted" style="margin:6px 0 0">${S.inRoom<sg.total?`Mới có ${S.inRoom}/${sg.total} bạn vào phòng. Bạn vào trễ vẫn chấm được trong thời gian còn lại.`:'Cả nhóm đã vào phòng.'}</p>`;
  }else if(S&&S.status==='running'){
    h+=`<p class="small muted" style="margin:6px 0 0">Đang chấm <b>Nhóm ${S.g}</b> · đã nộp ${S.submitted}/${sg.total}</p><div class="big-clock" id="bc"></div><div class="row" style="justify-content:center"><button class="btn ghost sm" data-act="extend">+5 phút</button><button class="btn brass sm" data-act="end">Kết thúc chấm</button></div>`;
  }else if(S){h+='<p class="small muted" style="margin:6px 0 0">Lượt chấm đã kết thúc.</p>'}
  else h+='<p class="small muted" style="margin:6px 0 0">Chưa bắt đầu.</p>';
  h+=`<div class="err">${esc(ERR)}</div>${MSG?`<div class="ok small">${esc(MSG)}</div>`:''}</div>`;
  // Kết quả
  if(S&&S.status==='ended'){
    h+=`<div class="card">${stepHead(5,'Kết quả Nhóm '+S.g,'ok')}<div class="row" style="margin-top:10px"><button class="btn brass" data-act="xlsx">Tải file Excel kết quả (tất cả nhóm đã chấm)</button><button class="btn ghost" data-act="next">Chấm nhóm khác</button></div>`+resultBlock(sg)+'</div>';
  }else if(S&&S.status==='running'&&sg.raters){
    h+=`<div class="card"><h3>Kết quả tạm thời Nhóm ${S.g}</h3>`+resultBlock(sg)+'</div>';
  }
  if(!S&&ST.hasResults)h+=`<div class="card"><h3>Kết quả đã có</h3><div class="row" style="margin-top:10px"><button class="btn brass sm" data-act="xlsx">Tải file Excel kết quả</button></div></div>`;
  {const M=ST.music||{wait:true,grade:true};h+=`<div class="card"><h3>🎵 Nhạc màn hình chiếu</h3><p class="small muted" style="margin:4px 0 0">Bật/tắt nhạc nền theo từng giai đoạn (cần bấm vào tab màn chiếu 1 lần để trình duyệt cho phát).</p><div class="row" style="margin-top:8px"><button class="btn ${M.wait?'brass':'ghost'} sm" data-act="music" data-stage="wait">${M.wait?'🔊':'🔇'} Lúc chờ & vào phòng: ${M.wait?'BẬT':'TẮT'}</button><button class="btn ${M.grade?'brass':'ghost'} sm" data-act="music" data-stage="grade">${M.grade?'🔊':'🔇'} Lúc đang chấm: ${M.grade?'BẬT':'TẮT'}</button></div></div>`}
  h+=`<div class="card"><h3>Công cụ</h3><div class="row" style="margin-top:8px"><button class="btn ${CONF==='clear'?'brass':'ghost'} sm" data-act="clear">${CONF==='clear'?'Bấm lần nữa để XÓA điểm Nhóm '+SEL:'Xóa điểm Nhóm '+SEL+' để chấm lại'}</button><button class="btn ${CONF==='reset'?'brass':'ghost'} sm" data-act="reset">${CONF==='reset'?'Bấm lần nữa để đăng xuất tất cả':'Đăng xuất tất cả sinh viên'}</button></div></div>`;
  if(S&&S.status==='open')h+=`<div class="abar"><div class="in"><div><div class="small" style="opacity:.8">Phòng chờ Nhóm ${S.g}</div><b style="font-size:18px">${S.inRoom}/${sg.total} bạn đã vào phòng</b></div><button class="btn brass" data-act="start">▶ Bắt đầu chấm (${S.minutes} phút)</button></div></div>`;
  else if(S&&S.status==='running')h+=`<div class="abar"><div class="in"><div><div class="small" style="opacity:.8">Đang chấm Nhóm ${S.g} · đã nộp ${S.submitted}/${sg.total}</div><b class="clk" id="abc"></b></div><div class="row"><button class="btn ghost sm" data-act="extend">+5 phút</button><button class="btn brass" data-act="end">■ Kết thúc chấm</button></div></div></div>`;
  else if(S&&S.status==='ended')h+=`<div class="abar"><div class="in"><b style="font-size:18px">Nhóm ${S.g} đã chấm xong</b><div class="row"><button class="btn brass" data-act="xlsx">⬇ Tải file Excel kết quả</button><button class="btn ghost sm" data-act="next">Chấm nhóm khác</button></div></div></div>`;
  else if(!S&&sg)h+=`<div class="abar"><div class="in"><b style="font-size:18px">Nhóm ${SEL} · ${MIN} phút</b><button class="btn brass" data-act="create">Tạo mã QR cho Nhóm ${SEL}</button></div></div>`;
  app.innerHTML=h;tick();
}
function tick(){
  const S=ST&&ST.session,el=document.getElementById('bc');if(!el||!S||S.status!=='running')return;
  const left=S.endsAt-nowS();const ab=document.getElementById('abc');if(ab)ab.textContent=nowS()<S.startsAt?'Chuẩn bị':mmss(left);el.textContent=nowS()<S.startsAt?'Chuẩn bị':mmss(left);el.className='big-clock'+(left<=60000?' low':'');
}
async function act(path,body,ok){
  ERR='';MSG='';
  try{await api(path,{method:'POST',headers:H(),body:JSON.stringify(body||{})});MSG=ok||''}catch(e){ERR=e.message}
  lastSig='';await refresh();
}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='login'){
    try{const j=await api('/api/h/admin/login',{method:'POST',body:JSON.stringify({password:document.getElementById('pw').value})});TOK=j.token;try{localStorage.setItem(LS,TOK)}catch(x){}ERR='';await refresh()}
    catch(x){ERR=x.message;login()}
  }
  else if(a==='pick')document.getElementById('fx').click();
  else if(a==='sel'){SEL=+b.dataset.g;lastSig='';draw()}
  else if(a==='min'){MIN=+b.dataset.m;lastSig='';draw()}
  else if(a==='create'){try{window.open('/hmo102/screen','hmo102screen')}catch(x){}await act('/api/h/admin/create',{g:SEL,minutes:MIN},'Đã tạo mã QR. Chiếu màn hình cho các bạn quét.');}
  else if(a==='start')await act('/api/h/admin/start',{},'Đã bắt đầu, phiếu chấm tự mở trên máy các bạn.');
  else if(a==='extend')await act('/api/h/admin/extend',{minutes:5},'Đã thêm 5 phút.');
  else if(a==='end'){if(confirm('Kết thúc chấm Nhóm '+ST.session.g+'?'))await act('/api/h/admin/end',{},'Đã kết thúc. Tải file Excel ở bên dưới.')}
  else if(a==='cancel'){if(confirm('Hủy phòng chờ này?'))await act('/api/h/admin/cancel',{},'Đã hủy phòng chờ.')}
  else if(a==='next')await act('/api/h/admin/next',{},'');
  else if(a==='music'){const st=b.dataset.stage,M=ST.music||{wait:true,grade:true};await act('/api/h/admin/music',{stage:st,on:!M[st]},'')}
  else if(a==='clear'||a==='reset'){
    if(CONF!==a){CONF=a;clearTimeout(confT);confT=setTimeout(()=>{CONF='';lastSig='';draw()},5000);lastSig='';draw();return}
    CONF='';clearTimeout(confT);
    if(a==='clear')await act('/api/h/admin/clear',{g:SEL,confirm:'XOA'},'Đã xóa điểm Nhóm '+SEL+'.');else await act('/api/h/admin/reset',{},'Đã đăng xuất tất cả sinh viên.');
  }
  else if(a==='xlsx'){
    try{const r=await fetch('/api/h/admin/report.xlsx',{headers:H()});if(!r.ok)throw new Error('Không tải được file');const bl=await r.blob();const u=URL.createObjectURL(bl);const l=document.createElement('a');l.href=u;l.download='HMO102-cham-cheo.xlsx';l.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}catch(x){ERR=x.message;lastSig='';draw()}
  }
});
document.addEventListener('change',async e=>{
  if(e.target.id!=='fx'||!e.target.files[0])return;
  try{const buf=await e.target.files[0].arrayBuffer();const r=await fetch('/api/h/admin/roster',{method:'POST',headers:H(),body:buf});const j=await r.json();if(!r.ok)throw new Error(j.error);cacheRoster(buf);MSG='Đã nạp '+j.added+' bạn, '+j.groups+' nhóm.';ERR=''}catch(x){ERR=x.message}
  lastSig='';await refresh();
});
if(TOK)refresh();else login();
setInterval(refresh,2500);setInterval(tick,250);
</script></body></html>
