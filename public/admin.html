<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giảng viên - Điều khiển buổi chấm</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap wide" id="app"></div>
<script>
(function () {
  var app = document.getElementById('app');
  var token = null; try { token = localStorage.getItem('cd_admin'); } catch (e) {}
  var S = null, timer = null, busy = false, lastSig = '', notice = '';

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opt.headers || {});
    if (opt.json) { opt.method = 'POST'; opt.body = JSON.stringify(opt.json); opt.headers['Content-Type'] = 'application/json'; }
    return fetch(path, opt).then(function (r) {
      if (r.status === 401 && path !== '/api/admin/login') { token = null; try { localStorage.removeItem('cd_admin'); } catch (e) {} loginScreen(); throw new Error('login'); }
      var ct = r.headers.get('content-type') || '';
      if (ct.indexOf('json') < 0) return r;
      return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || 'Lỗi'); return j; });
    });
  }
  function act(path, json, okMsg) {
    return api(path, { json: json || {} }).then(function () { notice = ''; return load(true); }).catch(function (e) { if (e.message !== 'login') { notice = e.message; load(true); } });
  }

  function loginScreen(msg) {
    stop(); app.innerHTML = '<div class="wrap"><div class="card"><h1>Giảng viên</h1><p class="muted">Nhập mật khẩu để điều khiển buổi chấm.</p><label for="pw">Mật khẩu</label><input id="pw" type="password">' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') + '<div style="margin-top:14px"><button class="full" id="ok">Đăng nhập</button></div></div></div>';
    var go = function () { fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: document.getElementById('pw').value }) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error); return j; }); })
      .then(function (j) { token = j.token; try { localStorage.setItem('cd_admin', token); } catch (e) {} load(true); start(); })
      .catch(function (e) { loginScreen(e.message); }); };
    document.getElementById('ok').onclick = go; document.getElementById('pw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  }

  var PHASE = { setup: 'Chuẩn bị', lobby: 'Phòng chờ', grading: 'Đang chấm', ended: 'Đã kết thúc' };
  function groupName(g) { return g.cls + ' · Nhóm ' + g.group; }
  var pick = {};   // lựa chọn tạm của giảng viên, giữ lại khi trang tự làm mới
  var openDet = {}; // danh sách thành viên nào đang mở
  // ô "chuyển sang nhóm tiếp theo" nằm ngay trong thẻ nhóm đang chấm
  function nextPanel(ag) {
    var others = S.groups.filter(function (g) { return g.key !== ag.key; });
    if (!others.length) return '';
    var sel = pick.nextkey && others.some(function (g) { return g.key === pick.nextkey; }) ? pick.nextkey : (others.filter(function (g) { return !g.order; })[0] || others[0]).key;
    return '<div style="margin-top:16px;padding:14px;border:1.5px dashed var(--line);border-radius:12px;background:var(--bg)"><b>Chuyển sang nhóm tiếp theo</b>' +
      '<p class="muted small" style="margin:4px 0 8px">Phần trình bày hiện tại sẽ đóng chấm, rồi đếm ngược 5 giây trước khi mở chấm nhóm mới.</p>' +
      '<div class="row" style="align-items:flex-end"><div style="flex:1;min-width:190px"><label style="margin:0 0 4px">Nhóm</label><select id="nextkey" class="fsel2" data-id="nextkey">' +
      others.map(function (g) { return '<option value="' + esc(g.key) + '"' + (g.key === sel ? ' selected' : '') + '>' + esc(groupName(g)) + (g.order ? ' (đã trình bày, ' + g.n + ' lượt)' : '') + '</option>'; }).join('') + '</select></div>' +
      '<div style="flex:1;min-width:190px" id="nextformwrap"><label style="margin:0 0 4px">Hình thức dự án</label>' + formSelect('nextform', pick.nextform) + '</div>' +
      '<button class="accent" id="nextgo" disabled>Chuyển nhóm và đếm ngược</button></div></div>';
  }
  function updNext() {
    var k = document.getElementById('nextkey'); if (!k) return;
    var g = S.groups.filter(function (x) { return x.key === k.value; })[0], need = g && !g.form;
    document.getElementById('nextformwrap').style.display = need ? '' : 'none';
    document.getElementById('nextgo').disabled = !g || (need && !document.getElementById('nextform').value);
  }
  function membersHtml(g, showJoin) {
    var joined = g.list.filter(function (m) { return m.joined; }).length;
    return '<details class="mem" data-k="' + esc(g.key) + '"' + (openDet[g.key] ? ' open' : '') + '><summary class="small"><b>Thành viên (' + g.list.length + ')</b>' + (showJoin ? ' · đã vào phòng ' + joined + '/' + g.list.length : '') + '</summary>' +
      '<ol class="small" style="margin:6px 0 0;padding-left:20px">' + g.list.map(function (m) {
        return '<li>' + esc(m.name) + ' <span class="muted">' + esc(m.mssv) + '</span>' + (m.leader ? ' <span class="tag">Nhóm trưởng</span>' : '') + (showJoin ? (m.joined ? ' <span class="tag ok">đã vào</span>' : ' <span class="muted">chưa vào</span>') : '') + '</li>';
      }).join('') + '</ol></details>';
  }
  function formSelect(id, val, cls) {
    return '<select id="' + id + '" class="' + (cls || 'fsel2') + '" data-id="' + id + '"><option value="">Chọn hình thức...</option>' +
      Object.keys(S.forms).map(function (f) { return '<option value="' + f + '"' + (val === f ? ' selected' : '') + '>' + esc(S.forms[f].label) + '</option>'; }).join('') + '</select>';
  }

  function render(force) {
    // chỉ hoãn vẽ lại khi đang mở ô chọn hình thức (tự làm mới); thao tác của giảng viên luôn vẽ lại ngay
    var ae = document.activeElement; if (!force && ae && ae.tagName === 'SELECT') return;
    var h = '<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1>Điều khiển buổi chấm</h1><span class="tag">' + PHASE[S.phase] + '</span> <span class="muted small">' + S.joined + '/' + S.total + ' sinh viên đã vào phòng</span></div>' +
      '<div class="row"><a href="/screen" target="_blank"><button class="ghost">Mở màn hình chiếu</button></a><button class="ghost" id="rep">Tải báo cáo Excel</button><button class="ghost" id="logout">Đăng xuất</button></div></div>';
    if (notice) h += '<div class="err" style="margin:0 0 12px">' + esc(notice) + '</div>';

    // 1. danh sách lớp
    if (S.phase === 'setup') {
      h += '<div class="card"><h2>Bước 1. Danh sách lớp</h2><p class="muted small">Tải file bảng điểm (.xlsx) của từng lớp, hệ thống tự đọc MSSV, họ tên và nhóm.</p>' +
        '<input type="file" id="files" accept=".xlsx" multiple style="margin-bottom:10px">' +
        (S.classes.length ? '<table><tr><th>Lớp</th><th>Số sinh viên</th><th></th></tr>' + S.classes.map(function (c) { return '<tr><td>' + esc(c.cls) + '</td><td>' + c.count + '</td><td style="text-align:right"><button class="ghost cdel" data-c="' + esc(c.cls) + '" style="padding:6px 12px;font-size:14px">Xóa lớp này</button></td></tr>'; }).join('') + '</table>' +
          (S.classes.length > 1 ? '<div style="margin-top:10px"><button class="ghost cdel" data-c="" style="padding:6px 12px;font-size:14px">Xóa tất cả danh sách</button></div>' : '') : '<p class="muted">Chưa có danh sách.</p>') + '</div>';
      // 2. tạo phòng chờ (hình thức từng nhóm được chọn lúc nhóm đó trình bày)
      if (S.groups.length) {
        var sc = S.classes.some(function (c) { return c.cls === pick.cls; }) ? pick.cls : S.classes[0].cls;
        h += '<div class="card"><h2>Bước 2. Mở phòng chờ</h2><p class="muted small">Mỗi buổi chấm chỉ dành cho <b>một lớp</b>: sinh viên lớp khác sẽ không vào được. Hình thức dự án (Workshop, Video, Fanpage Facebook) anh chọn riêng cho từng nhóm ngay lúc nhóm đó chuẩn bị trình bày.</p>' +
          (S.classes.length > 1 ? '<label style="margin-top:0">Chọn lớp chấm buổi này</label><select id="sescls" style="max-width:320px;margin-bottom:12px">' + S.classes.map(function (c) { return '<option value="' + esc(c.cls) + '"' + (c.cls === sc ? ' selected' : '') + '>' + esc(c.cls) + ' (' + c.count + ' sinh viên)</option>'; }).join('') + '</select>' : '') +
          '<table><tr><th>Lớp</th><th>Nhóm</th><th>Số bạn</th><th>Danh sách thành viên</th></tr>' +
          S.groups.filter(function (g) { return g.cls === sc; }).map(function (g) { return '<tr><td>' + esc(g.cls) + '</td><td>' + g.group + '</td><td>' + g.members + '</td><td>' + membersHtml(g, false) + '</td></tr>'; }).join('') +
          '</table><div style="margin-top:14px"><button class="accent" id="lobby">Tạo mã QR và mở phòng chờ' + (S.classes.length > 1 ? ' cho lớp ' + esc(sc) : '') + '</button></div></div>';
      }
    }

    // 3. phòng chờ
    if (S.phase === 'lobby') {
      h += '<div class="grid two"><div class="card center"><h2>Mã QR cho sinh viên' + (S.sessionClass ? ' · lớp ' + esc(S.sessionClass) : '') + '</h2><div class="qrbox" style="display:inline-block;background:#fff;padding:10px;border-radius:12px;border:2px solid var(--brand)"><img src="/qr.svg" alt="QR" style="width:220px;height:220px;display:block"></div>' +
        '<p class="small muted" id="url" style="margin-top:8px"></p><p class="small muted">Để chiếu QR lớn cho cả lớp, bấm "Mở màn hình chiếu".</p></div>' +
        '<div class="card"><h2>Bước 3. Kích hoạt chấm</h2><p><b style="font-size:32px">' + S.joined + '</b> <span class="muted">/ ' + S.total + ' sinh viên đã vào</span></p>' +
        '<label style="margin-top:0">Nhóm trình bày đầu tiên</label><select id="first">' + S.groups.map(function (g) { return '<option value="' + esc(g.key) + '"' + (pick.first === g.key ? ' selected' : '') + '>' + esc(groupName(g)) + '</option>'; }).join('') + '</select>' +
        '<label>Hình thức dự án của nhóm này</label>' + formSelect('firstform', pick.firstform) +
        '<div style="margin-top:14px"><button class="accent full" id="start"' + (pick.firstform ? '' : ' disabled') + '>Kích hoạt hệ thống chấm (đếm ngược 5 giây)</button></div></div></div>' +
        '<div class="card"><h2>Thành viên từng nhóm</h2><p class="muted small">Xem ai đã vào phòng, ai chưa.</p><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">' +
        S.groups.map(function (g) { return '<div class="gcard"><b>' + esc(groupName(g)) + '</b><div style="margin-top:6px">' + membersHtml(g, true) + '</div></div>'; }).join('') + '</div></div>';
    }

    // 4. đang chấm / kết thúc
    if (S.phase === 'grading' || S.phase === 'ended') {
      var ag = S.groups.filter(function (g) { return g.key === S.activeKey; })[0];
      if (S.phase === 'grading' && ag) {
        var pct = ag.eligible ? Math.round(ag.n / ag.eligible * 100) : 0;
        h += '<div class="card" style="border-color:var(--accent)"><div class="row" style="justify-content:space-between"><div><span class="tag">Phần trình bày thứ ' + ag.order + '</span> <span class="tag warn">' + esc(ag.formLabel) + '</span>' +
          '<h2 style="margin-top:8px">' + esc(groupName(ag)) + '</h2></div><div class="center"><div class="small muted">Điểm trung bình hiện tại</div><div style="font-size:44px;font-weight:800;color:var(--accent);line-height:1">' + (ag.total == null ? '—' : ag.total.toFixed(2)) + '</div></div></div>' +
          '<div class="row small" style="margin:8px 0 4px"><span>Đã chấm <b>' + ag.n + '</b> / ' + ag.eligible + ' sinh viên đủ điều kiện</span><span class="tag ' + (S.open ? 'ok' : 'bad') + '">' + (S.open ? 'Đang mở chấm' : 'Đã đóng chấm') + '</span>' + (S.startsAt && (S.startsAt - (S.now + (Date.now() - S.fetchedAt))) > 0 ? '<span class="tag warn">Đang đếm ngược 5 giây</span>' : '') + '</div>' +
          '<div class="bar"><i style="width:' + pct + '%"></i></div>' +
          '<div class="row" style="margin-top:14px">' + (S.open ? '<button id="close" class="danger">Đóng chấm nhóm này</button>' : '<button id="open">Mở lại chấm</button>') + '<button id="back" class="ghost">← Quay lại phòng chờ</button>' +
          '<button class="ghost greset" data-k="' + esc(ag.key) + '"' + (ag.n ? '' : ' disabled') + '>Reset điểm nhóm này</button>' +
          '<label class="row" style="margin:0;font-weight:500"><input type="checkbox" id="live"' + (S.showLive ? ' checked' : '') + '> Hiện điểm trực tiếp trên màn hình chiếu</label></div>' +
          ((S.pending && S.pending.length) ? '<details style="margin-top:12px"><summary class="small"><b>' + S.pending.length + '</b> sinh viên chưa chấm</summary><p class="small muted" style="margin-top:8px">' + S.pending.map(function (p) { return esc(p.name) + ' (' + esc(p.mssv) + ')'; }).join(' · ') + '</p></details>' : '') + nextPanel(ag) + '</div>';
      }
      h += '<div class="card"><h2>' + (S.phase === 'ended' ? 'Kết quả' : 'Các phần trình bày') + '</h2><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">';
      S.groups.forEach(function (g) {
        var act = g.key === S.activeKey && S.phase === 'grading';
        h += '<div class="gcard' + (act ? ' active' : '') + '"><div class="row" style="justify-content:space-between"><b>' + esc(groupName(g)) + '</b>' + (g.form ? '<span class="tag warn">' + esc(g.formLabel) + '</span>' : '<span class="tag">Chưa chọn</span>') + '</div>' +
          '<div class="small muted" style="margin:6px 0">' + (g.order ? 'Thứ ' + g.order + ' · ' + g.n + ' lượt chấm' : 'Chưa trình bày') + '</div>' +
          '<div style="font-size:26px;font-weight:800">' + (g.total == null ? '—' : g.total.toFixed(2)) + '</div>' +
          '<div style="margin:6px 0">' + membersHtml(g, S.phase === 'grading') + '</div>' +
          (S.phase === 'grading' && g.n && !act ? '<button class="ghost full greset" data-k="' + esc(g.key) + '" style="margin-bottom:8px">Reset điểm nhóm này (' + g.n + ' lượt)</button>' : '') +
          (S.phase === 'grading' && !act ? (g.form ? '' : '<div style="margin-top:8px">' + formSelect('gf_' + g.key, pick['gf_' + g.key], 'fsel2') + '</div>') +
            '<button class="' + (g.order ? 'ghost' : 'accent') + ' full gstart" data-k="' + esc(g.key) + '" style="margin-top:8px"' + (!g.form && !pick['gf_' + g.key] ? ' disabled' : '') + '>' + (g.order ? 'Mở lại nhóm này' : 'Chuyển sang nhóm này') + '</button>' : '') + '</div>';
      });
      h += '</div></div>';
      if (S.phase === 'grading') h += '<div class="card"><h2>Bước 5. Kết thúc buổi chấm</h2><p class="muted small">Sau khi kết thúc, sinh viên của từng nhóm sẽ thấy điểm tổng của nhóm mình trên điện thoại, và màn hình chiếu hiện bảng kết quả. Anh tải báo cáo Excel ở nút phía trên.</p><button class="danger" id="end">Kết thúc buổi chấm</button></div>';
      if (S.phase === 'ended') h += '<div class="card"><p class="muted small">Buổi chấm đã kết thúc. Hãy tải báo cáo Excel trước khi bắt đầu buổi mới.</p><button class="ghost" id="reset">Bắt đầu buổi chấm mới (xóa toàn bộ điểm)</button></div>';
    }
    app.innerHTML = h; bind();
  }

  function modal(title, text, okLabel, cls, fn) {
    var m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = '<div class="box"><h2>' + title + '</h2><p class="muted">' + text + '</p><div class="row"><button class="ghost" id="n">Hủy</button><button class="' + cls + '" id="y">' + okLabel + '</button></div></div>';
    document.body.appendChild(m); m.querySelector('#n').onclick = function () { m.remove(); }; m.querySelector('#y').onclick = function () { m.remove(); fn(); };
  }
  function bind() {
    var $ = function (id) { return document.getElementById(id); };
    $('logout').onclick = function () {
      modal('Đăng xuất?', 'Buổi chấm vẫn tiếp tục chạy bình thường. Chỉ cần nhập lại mật khẩu để điều khiển.', 'Đăng xuất', 'accent', function () {
        stop(); token = null; S = null; lastSig = '';
        try { localStorage.removeItem('cd_admin'); } catch (e) {}
        loginScreen();
      });
    };
    $('rep').onclick = function () {
      api('/api/admin/report.xlsx').then(function (r) { return r.blob(); }).then(function (b) {
        var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'bao-cao-cham-diem.xlsx'; document.body.appendChild(a); a.click(); a.remove();
      });
    };
    if ($('files')) $('files').onchange = function () {
      var fs = Array.prototype.slice.call(this.files); notice = '';
      fs.reduce(function (p, f) { return p.then(function () { return f.arrayBuffer().then(function (buf) { return api('/api/admin/roster', { method: 'POST', body: buf, headers: { 'Content-Type': 'application/octet-stream' } }); }); }); }, Promise.resolve())
        .then(function () { load(true); }).catch(function (e) { notice = e.message; load(true); });
    };
    document.querySelectorAll('.fsel2').forEach(function (s) {
      s.onchange = function () {
        pick[s.getAttribute('data-id')] = s.value || '';
        if (s.id === 'nextkey' || s.id === 'nextform') { updNext(); return; }
        var btn = s.id === 'firstform' ? $('start') : (s.parentNode.nextElementSibling);
        if (btn) btn.disabled = !s.value;
      };
    });
    if ($('first')) $('first').onchange = function () { pick.first = this.value; };
    if ($('nextgo')) {
      updNext();
      $('nextgo').onclick = function () {
        var k = $('nextkey').value, g = S.groups.filter(function (x) { return x.key === k; })[0], f = g && !g.form ? $('nextform').value : '';
        modal('Chuyển sang ' + esc(groupName(g)) + '?', 'Phần trình bày hiện tại sẽ đóng chấm, màn hình chiếu và điện thoại sinh viên đếm ngược 5 giây rồi mở chấm nhóm mới.', 'Chuyển nhóm', 'accent', function () { act('/api/admin/start', { key: k, form: f }); });
      };
    }
    document.querySelectorAll('.cdel').forEach(function (b) {
      b.onclick = function () {
        var c = b.getAttribute('data-c');
        modal(c ? 'Xóa danh sách lớp ' + esc(c) + '?' : 'Xóa tất cả danh sách lớp?', c ? 'Danh sách sinh viên và các nhóm của lớp này sẽ bị xóa khỏi hệ thống. Anh có thể tải lại file bất kỳ lúc nào.' : 'Danh sách sinh viên của mọi lớp sẽ bị xóa khỏi hệ thống. Anh có thể tải lại file bất kỳ lúc nào.', 'Xóa', 'danger', function () { act('/api/admin/roster/delete', { cls: c }); });
      };
    });
    document.querySelectorAll('details.mem').forEach(function (d) { d.addEventListener('toggle', function () { openDet[d.getAttribute('data-k')] = d.open; }); });
    document.querySelectorAll('.greset').forEach(function (b) {
      b.onclick = function () {
        var k = b.getAttribute('data-k'), g = S.groups.filter(function (x) { return x.key === k; })[0];
        modal('Reset điểm nhóm này?', 'Xóa toàn bộ <b>' + g.n + '</b> lượt chấm của ' + esc(groupName(g)) + '. Các bạn đã chấm của nhóm này sẽ chấm lại được. Không thể hoàn tác.', 'Xóa điểm', 'danger', function () { act('/api/admin/resetgroup', { key: k }); });
      };
    });
    if ($('sescls')) $('sescls').onchange = function () { pick.cls = this.value; render(true); };
    if ($('lobby')) $('lobby').onclick = function () { act('/api/admin/lobby', { cls: $('sescls') ? $('sescls').value : '' }); };
    if ($('start')) $('start').onclick = function () { act('/api/admin/start', { key: $('first').value, form: $('firstform').value }); };
    if ($('url')) fetch('/api/public-url').then(function (r) { return r.json(); }).then(function (j) { if ($('url')) $('url').textContent = j.url; });
    if ($('back')) $('back').onclick = function () {
      modal('Quay lại phòng chờ?', 'Dừng chấm nhóm hiện tại và về màn chọn nhóm. Điểm đã chấm (nếu có) vẫn được giữ, nhóm này chấm lại được sau.', 'Quay lại', 'accent', function () { act('/api/admin/back', {}); });
    };
    if ($('close')) $('close').onclick = function () { act('/api/admin/toggle', { open: false }); };
    if ($('open')) $('open').onclick = function () { act('/api/admin/toggle', { open: true }); };
    if ($('live')) $('live').onchange = function () { act('/api/admin/live', { show: this.checked }); };
    document.querySelectorAll('.gstart').forEach(function (b) { b.onclick = function () { var k = b.getAttribute('data-k'), f = pick['gf_' + k] || ''; modal('Chuyển nhóm?', 'Phần trình bày hiện tại sẽ đóng chấm và chuyển sang nhóm được chọn, có đếm ngược 5 giây.', 'Chuyển', 'accent', function () { act('/api/admin/start', { key: k, form: f }); }); }; });
    if ($('end')) $('end').onclick = function () { modal('Kết thúc buổi chấm?', 'Sinh viên sẽ không chấm thêm được nữa và điểm tổng được gửi về từng nhóm. Không thể hoàn tác.', 'Kết thúc', 'danger', function () { act('/api/admin/end'); }); };
    if ($('reset')) $('reset').onclick = function () { modal('Xóa toàn bộ điểm?', 'Toàn bộ điểm và danh sách sinh viên đã vào phòng sẽ bị xóa. Hãy chắc rằng anh đã tải báo cáo Excel.', 'Xóa', 'danger', function () { act('/api/admin/reset', { confirm: 'XOA' }); }); };
  }

  function load(force) {
    if (!token) return Promise.resolve();
    return api('/api/admin/state').then(function (j) {
      var sig = JSON.stringify(Object.assign({}, j, { now: 0 })); if (!force && sig === lastSig) return; lastSig = sig; S = j; S.fetchedAt = Date.now(); render(force);
    }).catch(function () {});
  }
  function start() { stop(); timer = setInterval(function () { load(false); }, 2000); }
  function stop() { if (timer) clearInterval(timer); timer = null; }

  if (token) { load(true).then(function () { if (token) start(); }); } else loginScreen();
})();
</script>
</body>
</html>
