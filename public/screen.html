    }

        var d = c.avg - old, dl = row.querySelector('.delta'); dl.textContent = (d > 0 ? '+' : '−') + Math.abs(d).toFixed(2); dl.className = 'delta show'; dl.style.color = d > 0 ? '#17794a' : '#c62828';
