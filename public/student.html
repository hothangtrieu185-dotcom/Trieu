<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chấm điểm phần trình bày</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,600;0,700;0,800;1,800&family=Itim&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/theme.css">
<script src="/doodle.js"></script>
</head>
<body>
<div class="wrap" id="app"></div>
<div id="lo" class="center" style="display:none;padding:6px 0 26px"><button id="logout" class="ghost" style="font-size:14px;padding:8px 16px">Đăng xuất</button></div>
<script>
(function () {
  var app = document.getElementById('app');
  var token = null; try { token = localStorage.getItem('cd_token'); } catch (e) {}
  var view = null, lastSig = '', scores = {}, step = 0, offset = 0, timer = null, cdTimer = null, curKey = null, cdShown = 0;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function api(path, opt) {
    opt = opt || {}; opt.headers = Object.assign({ 'Content-Type': 'application/json' }, token ? { 'x-token': token } : {}, opt.headers || {});
    return fetch(path, opt).then(function (r) { return r.json().then(function (j) { if (!r.ok) { var e = new Error(j.error || 'Lỗi'); e.status = r.status; throw e; } return j; }); });
  }
  function now() { return Date.now() + offset; }
  function buzz(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) {} }
  function band(v) { if (v == null) return 'Kéo thanh trượt hoặc chọn nhanh'; if (v >= 10) return '🌟 Xuất sắc'; if (v >= 8.5) return '👏 Rất tốt'; if (v >= 7) return '👍 Khá tốt'; if (v >= 5) return '🙂 Đạt yêu cầu'; return '💪 Cần cải thiện'; }
  function who() { return view && view.me ? '<p class="center muted small" style="margin-top:14px">' + esc(view.me.name) + ' · ' + esc(view.me.mssv) + '</p>' : ''; }

  // ---------- vào phòng ----------
  function joinScreen(msg) {
    app.innerHTML = '<div class="hero anim-up"><h1>Chấm điểm phần trình bày</h1><p class="muted" style="margin:6px 0 0">Nhập thông tin để vào phòng chấm và cùng đánh giá các nhóm.</p>' + DOODLE() + '</div>' +
      '<div class="card anim-up" style="animation-delay:.1s"><label for="nm" style="margin-top:0">Họ và tên</label><input id="nm" type="text" autocomplete="name" placeholder="Ví dụ: Nguyễn Văn An">' +
      '<label for="ms">MSSV</label><input id="ms" type="text" autocapitalize="characters" autocomplete="off" placeholder="Ví dụ: DE201433">' +
      (msg ? '<div class="err">' + esc(msg) + '</div>' : '') +
      '<div style="margin-top:16px"><button class="accent full" id="go" style="padding:15px;font-size:17px">Vào phòng chấm</button></div>' +
      '<div class="notice" style="margin-bottom:0"><b>⚠️ Lưu ý:</b> bạn không được chấm điểm nhóm của mình (bài dự thi của chính bạn).</div><p class="muted small" style="margin:12px 0 0">🔒 Chỉ giảng viên biết bạn đã chấm gì. Các nhóm được chấm không biết ai đã chấm.</p></div>';
    var go = document.getElementById('go');
    go.onclick = function () {
      go.disabled = true; go.textContent = 'Đang kiểm tra...';
      api('/api/join', { method: 'POST', body: JSON.stringify({ name: document.getElementById('nm').value, mssv: document.getElementById('ms').value }) })
        .then(function (j) { token = j.token; try { localStorage.setItem('cd_token', token); } catch (e) {} setView(j); render(true); startPolling(); })
        .catch(function (e) { joinScreen(e.message); });
    };
  }
  function waiting(icon, title, text, extra) {
    app.innerHTML = '<div class="card center anim-up" style="padding:28px 18px"><div class="emoji-float">' + icon + '</div><h1 style="margin-top:8px">' + title + '</h1><p class="muted">' + text + '</p>' + (extra || '') + '</div>' + who();
  }
  function curGroup() { var r = view && view.room; if (!r || !curKey) return null; return r.groups.filter(function (g) { return g.key === curKey; })[0] || null; }
  function pbar(r) { var pct = r.need ? Math.round(r.done / r.need * 100) : 0; return '<div class="progress"><i id="pbar" style="width:' + pct + '%"></i></div><p class="muted small" style="margin:8px 0 0">Bạn đã chấm <b id="pn">' + r.done + '</b> / <span id="pe">' + r.need + '</span> nhóm</p>'; }

  // ---------- đếm ngược ----------
  function countdown(a) {
    var ov = document.createElement('div'); ov.className = 'cd-overlay'; ov.id = 'cd';
    ov.innerHTML = '<div style="font-size:26px;font-weight:700;margin-bottom:10px">Phòng chấm sắp mở</div><div class="cd-num" id="cdn"></div>';
    document.body.appendChild(ov);
    var shown = null;
    function tick() {
      var left = Math.ceil((a.startsAt - now()) / 1000);
      if (left <= 0) { clearInterval(cdTimer); cdTimer = null; ov.remove(); lastSig = ''; render(true); return; }
      if (left !== shown) { shown = left; var n = document.getElementById('cdn'); n.textContent = left; n.style.animation = 'none'; void n.offsetWidth; n.style.animation = ''; buzz(30); }
    }
    clearInterval(cdTimer); tick(); if (document.getElementById('cd')) cdTimer = setInterval(tick, 100);
  }

  // ---------- chấm điểm từng tiêu chí ----------
  function dots(n) { var h = '<div class="dots">'; for (var i = 0; i <= n; i++) h += '<i class="' + (i < step ? 'on' : '') + (i === step ? ' cur' : '') + '"></i>'; return h + '</div>'; }
  function gradeScreen() {
    var a = curGroup(), crit = a.criteria, n = crit.length;
    var head = '<div class="row" style="justify-content:center;margin-bottom:10px"><span class="tag">Nhóm ' + esc(a.group) + '</span><span class="tag warn">' + esc(a.formLabel) + '</span></div>' + dots(n);
    if (step >= n) return reviewScreen(head);
    var c = crit[step], v = scores[c.id];
    var html = head + '<div class="card anim-in" id="stepcard"><div class="row" style="justify-content:space-between"><span class="small muted">Tiêu chí ' + (step + 1) + '/' + n + '</span><span class="tag">Trọng số ' + c.weight + '%</span></div>' +
      '<h1 style="margin:6px 0 2px">' + esc(c.name) + '</h1><p class="muted small" style="margin-bottom:12px">' + esc(c.desc) + '</p>' +
      '<div class="bigval' + (v == null ? '' : ' set') + '" id="bv">' + (v == null ? '–' : v.toFixed(1)) + '</div><div class="band" id="bd">' + band(v) + '</div>' +
      '<div class="row" style="flex-wrap:nowrap;gap:12px"><button class="ghost step-btn" id="dn" aria-label="Giảm">−</button><input class="rng" id="rg" type="range" min="0" max="10" step="0.5" value="' + (v == null ? 5 : v) + '" style="--p:' + ((v == null ? 5 : v) * 10) + '%"><button class="ghost step-btn" id="up" aria-label="Tăng">+</button></div>' +
      '<div class="chips" id="chips">' + [5, 6, 7, 8, 9, 10].map(function (x) { return '<button data-v="' + x + '"' + (v === x ? ' class="on"' : '') + '>' + x + '</button>'; }).join('') + '</div>' +
      '<div class="nav">' + (step > 0 ? '<button class="ghost" id="bk">Quay lại</button>' : '') + '<button class="accent" id="nx"' + (v == null ? ' disabled' : '') + '>' + (step === n - 1 ? 'Xem lại và gửi' : 'Tiếp tục') + '</button></div></div><div class="center" style="margin-top:10px"><button class="ghost" id="tolist" style="font-size:14px;padding:8px 16px">← Về danh sách nhóm</button></div>' + who();
    app.innerHTML = html;
    document.getElementById('tolist').onclick = function () { curKey = null; scores = {}; step = 0; lastSig = ''; render(true); };
    function set(val) {
      val = Math.max(0, Math.min(10, Math.round(val * 2) / 2)); scores[c.id] = val;
      var bv = document.getElementById('bv'); bv.textContent = val.toFixed(1); bv.className = 'bigval set';
      document.getElementById('bd').textContent = band(val); var rg = document.getElementById('rg'); rg.value = val; rg.style.setProperty('--p', val * 10 + '%');
      document.getElementById('nx').disabled = false; buzz(8);
      document.querySelectorAll('#chips button').forEach(function (b) { b.className = parseFloat(b.getAttribute('data-v')) === val ? 'on' : ''; });
    }
    var rg = document.getElementById('rg'); rg.addEventListener('input', function () { set(parseFloat(rg.value)); });
    document.getElementById('dn').onclick = function () { set((scores[c.id] == null ? 5 : scores[c.id]) - 0.5); };
    document.getElementById('up').onclick = function () { set((scores[c.id] == null ? 5 : scores[c.id]) + 0.5); };
    document.querySelectorAll('#chips button').forEach(function (b) { b.onclick = function () { set(parseFloat(b.getAttribute('data-v'))); }; });
    document.getElementById('nx').onclick = function () { step++; gradeScreen(); window.scrollTo(0, 0); };
    if (step > 0) document.getElementById('bk').onclick = function () { step--; gradeScreen(); window.scrollTo(0, 0); };
  }
  function totalOf(crit) { var t = 0; crit.forEach(function (c) { t += (scores[c.id] || 0) * c.weight / 100; }); return t; }
  function reviewScreen(head) {
    var crit = curGroup().criteria;
    var html = head + '<div class="card anim-in"><h1>Xem lại điểm của bạn</h1><p class="muted small">Bấm vào một dòng để sửa. Sau khi gửi, bạn vẫn sửa lại được đến khi giảng viên đóng phòng chấm.</p>' +
      crit.map(function (c, i) { return '<div class="rev" data-i="' + i + '"><span>' + esc(c.name) + ' <span class="muted small">(' + c.weight + '%)</span></span><b>' + scores[c.id].toFixed(1) + '</b></div>'; }).join('') +
      '<div class="center" style="margin-top:14px"><div class="muted small">Điểm tổng của bạn</div><div class="bigval set" id="tot">' + totalOf(crit).toFixed(2) + '</div><div class="muted small">/ 10</div></div>' +
      '<div class="err" id="serr" style="display:none"></div>' +
      '<div class="nav"><button class="ghost" id="bk">Quay lại</button><button class="accent" id="send">' + (curGroup().mine ? 'Cập nhật điểm' : 'Gửi điểm') + '</button></div></div>' + who();
    app.innerHTML = html;
    document.querySelectorAll('.rev').forEach(function (r) { r.onclick = function () { step = parseInt(r.getAttribute('data-i'), 10); gradeScreen(); }; });
    document.getElementById('bk').onclick = function () { step = crit.length - 1; gradeScreen(); };
    document.getElementById('send').onclick = function () {
      var b = this; b.disabled = true; b.textContent = 'Đang gửi...';
      var lbl = curGroup().mine ? 'Cập nhật điểm' : 'Gửi điểm';
      api('/api/rate', { method: 'POST', body: JSON.stringify({ key: curKey, scores: scores }) })
        .then(function () { scores = {}; step = 0; curKey = null; lastSig = ''; buzz([40, 40, 80]); return poll().then(function () { confetti(); }); })
        .catch(function (e) { b.disabled = false; b.textContent = lbl; var er = document.getElementById('serr'); er.style.display = 'block'; er.textContent = e.message; });
    };
  }
  function confetti() {
    var em = ['🎉', '⭐', '✨', '❤️', '🎊', '🌹'];
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('span'); s.className = 'confetti'; s.textContent = em[i % em.length];
      s.style.left = Math.random() * 100 + 'vw'; s.style.animationDuration = 1.8 + Math.random() * 1.6 + 's'; s.style.animationDelay = Math.random() * .5 + 's';
      document.body.appendChild(s); setTimeout((function (x) { return function () { x.remove(); }; })(s), 4500);
    }
  }

  // ---------- điều phối ----------
  function setView(j) { view = j; if (j.now) offset = j.now - Date.now(); var lo = document.getElementById('lo'); if (lo) lo.style.display = 'block'; }
  function logout() {
    if (!confirm('Đăng xuất khỏi phòng chấm? Các điểm đã gửi vẫn được giữ. Bạn chỉ cần nhập lại họ tên và MSSV để vào lại.')) return;
    stopPolling(); clearInterval(cdTimer); token = null; view = null; lastSig = ''; scores = {}; step = 0; curKey = null;
    try { localStorage.removeItem('cd_token'); } catch (e) {}
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
    var lo = document.getElementById('lo'); if (lo) lo.style.display = 'none';
    var cd = document.getElementById('cd'); if (cd) cd.remove();
    joinScreen();
  }
  document.getElementById('logout').onclick = logout;
  function render(force) {
    if (!view) return;
    var r0 = view.room, counting = r0 && r0.startsAt && now() < r0.startsAt;
    var sig = [view.phase, r0 ? r0.open + '|' + curKey + '|' + (counting ? 'cd' : '') + '|' + r0.groups.map(function (g) { return g.key + (g.mine ? g.mine.total : '-'); }).join(',') : '', view.result ? 'r' : ''].join('~');
    if (!force && sig === lastSig) { liveUpdate(); return; }
    lastSig = sig;
    var old = document.getElementById('cd'); if (old && !counting) { old.remove(); clearInterval(cdTimer); cdTimer = null; }
    if (view.phase === 'lobby') {
      app.innerHTML = '<div class="card center anim-up" style="padding:28px 18px">' + DOODLE() + '<h1 style="margin-top:8px">Đã ghi nhận!</h1><p>Xin chào <b>' + esc(view.me.name) + '</b></p>' +
        '<div class="notice"><b>⚠️ Lưu ý quan trọng</b><br>Bạn thuộc <b>Nhóm ' + esc(view.me.group) + '</b> (lớp ' + esc(view.me.cls) + '). Bạn <b>không được chấm điểm nhóm của mình</b> vì đó là bài dự thi của chính bạn. Tất cả các nhóm còn lại bạn chấm trong cùng một phòng chấm.</div>' +
        '<p class="muted"><span class="pulse"></span>Vui lòng chờ giảng viên bắt đầu chấm</p><div style="margin-top:14px"><div class="muted small">Đã có</div><div class="bigval set" id="cnt" style="font-size:64px">' + view.joined + '</div><div class="muted small">bạn trong phòng</div></div></div>' + who();
    } else if (view.phase === 'grading') {
      if (!r0) return waiting('⏳', 'Vui lòng chờ', 'Phòng chấm đang được chuẩn bị.');
      if (counting) { app.innerHTML = ''; return countdown(r0); }
      if (curKey && curGroup() && r0.open) { step = 0; scores = Object.assign({}, curGroup().mine ? curGroup().mine.scores : {}); if (curGroup().mine) step = 0; return gradeScreen(); }
      curKey = null; roomList();
    } else if (view.phase === 'ended') {
      var r = view.result;
      if (r && r.total != null) {
        var rows = r.criteria.map(function (c) { return '<div class="rev" style="cursor:default"><span>' + esc(c.name) + '</span><b>' + (c.avg == null ? '–' : c.avg.toFixed(2)) + '</b></div>'; }).join('');
        app.innerHTML = '<div class="hero center anim-up">' + DOODLE() + '<h1>Kết quả nhóm của bạn</h1><p class="muted">' + esc(r.formLabel) + ' · ' + r.n + ' lượt chấm</p><div style="font-size:72px;font-weight:900;line-height:1.1" id="fin">0.00</div><p class="muted">Điểm trung bình (thang 10)</p></div>' +
          '<div class="card anim-up" style="animation-delay:.15s"><h3>Điểm theo từng tiêu chí</h3>' + rows + '</div>' + who();
        countUp(document.getElementById('fin'), r.total); confetti();
      } else waiting('🎉', 'Buổi chấm đã kết thúc', 'Cảm ơn bạn đã tham gia đánh giá.');
    } else waiting('⏳', 'Chưa mở phòng chấm', 'Vui lòng chờ giảng viên.');
  }
  function roomList() {
    var r = view.room, h = '<div class="hero anim-up" style="padding-bottom:6px"><h1>Phòng chấm</h1><p class="muted" style="margin:6px 0 0">' + (r.open ? 'Chọn một nhóm để chấm. Bạn chấm theo thứ tự nào cũng được và sửa lại được đến khi giảng viên đóng phòng.' : '🔒 Giảng viên đã đóng phòng chấm. Điểm của bạn đã được ghi nhận.') + '</p></div>' +
      '<div class="card" style="padding:14px 16px">' + pbar(r) + '</div>';
    r.groups.forEach(function (g) {
      var state = g.own ? '<span class="tag">Nhóm của bạn</span>' : (g.mine ? '<span class="tag ok">Đã chấm · ' + g.mine.total.toFixed(2) + '</span>' : '<span class="tag bad">Chưa chấm</span>');
      var btn = g.own ? '<p class="muted small" style="margin:8px 0 0">Bạn không chấm nhóm của mình.</p>' : (r.open ? '<button class="' + (g.mine ? 'ghost' : 'accent') + ' full gopen" data-k="' + esc(g.key) + '" style="margin-top:10px">' + (g.mine ? 'Sửa điểm' : 'Chấm nhóm này') + '</button>' : '');
      h += '<div class="card anim-up"' + (g.own ? ' style="opacity:.7"' : '') + '><div class="row" style="justify-content:space-between"><b style="font-size:20px">Nhóm ' + esc(g.group) + '</b><span class="tag warn">' + esc(g.formLabel) + '</span></div><div style="margin-top:6px">' + state + '</div>' + btn + '</div>';
    });
    app.innerHTML = h + who();
    document.querySelectorAll('.gopen').forEach(function (b) { b.onclick = function () { curKey = b.getAttribute('data-k'); lastSig = ''; render(true); window.scrollTo(0, 0); }; });
  }
  function liveUpdate() {
    var c = document.getElementById('cnt'); if (c) c.textContent = view.joined;
    var r = view.room, pb = document.getElementById('pbar');
    if (r && pb) { pb.style.width = (r.need ? Math.round(r.done / r.need * 100) : 0) + '%'; document.getElementById('pn').textContent = r.done; document.getElementById('pe').textContent = r.need; }
  }
  function countUp(el, to) { var t0 = performance.now(); (function f(t) { var p = Math.min(1, (t - t0) / 1200); el.textContent = (to * (1 - Math.pow(1 - p, 3))).toFixed(2); if (p < 1) requestAnimationFrame(f); })(t0); }

  // đồng hồ còn lại của phòng chấm (nổi ở góc màn hình)
  setInterval(function () {
    var r = view && view.phase === 'grading' ? view.room : null, el = document.getElementById('tmrpill');
    var left = r && r.open && r.endsAt && now() >= r.startsAt ? Math.max(0, Math.ceil((r.endsAt - now()) / 1000)) : -1;
    if (left < 0) { if (el) el.remove(); return; }
    if (!el) { el = document.createElement('div'); el.id = 'tmrpill'; el.style.cssText = 'position:fixed;top:10px;right:10px;z-index:200;padding:8px 14px;border-radius:999px;background:#fff;border:2px solid #1b1b1b;font:800 18px sans-serif;box-shadow:0 3px 0 #1b1b1b;font-variant-numeric:tabular-nums'; document.body.appendChild(el); }
    el.textContent = '⏱️ ' + Math.floor(left / 60) + ':' + ('0' + left % 60).slice(-2); el.style.color = left <= 60 ? '#c0392b' : '#1b1b1b';
  }, 500);
  function poll() {
    return api('/api/state').then(function (j) { setView(j); render(false); })
      .catch(function (e) { if (e.status === 401) { stopPolling(); token = null; try { localStorage.removeItem('cd_token'); } catch (x) {} joinScreen(); } });
  }
  function startPolling() { stopPolling(); timer = setInterval(poll, 1500); }
  function stopPolling() { if (timer) clearInterval(timer); timer = null; }

  if (token) { api('/api/state').then(function (j) { setView(j); render(true); startPolling(); }).catch(function () { token = null; joinScreen(); }); }
  else joinScreen();
})();
</script>
</body>
</html>
